name: Собрать приложение iPhone
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Подготовить интерфейс и расписание
        run: node ios/scripts/prepare.mjs
      - name: Подготовить иконку
        run: |
          mkdir -p ios/Sources/Assets.xcassets/AppIcon.appiconset
          sips -z 1024 1024 icon-512.png --out ios/Sources/Assets.xcassets/AppIcon.appiconset/icon.png
          cat > ios/Sources/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
      - name: Создать проект Xcode
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Собрать приложение без подписи
        run: >-
          xcodebuild -project ios/Raspisanie.xcodeproj
          -scheme Raspisanie -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
      -       - name: Проверить данные приложения и упаковать IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Raspisanie.app"
          PLIST="$APP/Info.plist"

          plutil -replace CFBundleIdentifier -string "io.github.8gzw6dtvjsai.raspisanie" "$PLIST"
          plutil -replace CFBundleExecutable -string "Raspisanie" "$PLIST"
          plutil -replace CFBundleName -string "Raspisanie" "$PLIST"
          plutil -replace CFBundleDisplayName -string "Расписание" "$PLIST"
          plutil -replace CFBundlePackageType -string "APPL" "$PLIST"
          plutil -replace CFBundleShortVersionString -string "1.0.1" "$PLIST"
          plutil -replace CFBundleVersion -string "2" "$PLIST"

          plutil -lint "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"
          test -f "$APP/Raspisanie"

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Raspisanie-unsigned.ipa Payload
