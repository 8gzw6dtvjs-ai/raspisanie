name: Обновить расписание

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Поставить jsdom
        run: npm install --no-save --no-audit --no-fund jsdom@24.1.3

      - name: Скачать таблицу и собрать data.json
        id: data
        run: node update.mjs

      - name: Сохранить изменения в репозитории
        if: steps.data.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Расписание обновлено" || exit 0
          git push

      - name: Подготовить сайт
        run: |
          mkdir -p _site
          cp index.html practice.js practice.css data.json manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
